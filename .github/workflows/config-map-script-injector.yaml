name: Update ConfigMap Qdrant Script
on:
  push:
    paths:
      - 'qdrant-backup-restore/qdrant_backup_recovery.sh'

permissions:
  contents: write

jobs:
  update-qdrant-configmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update ConfigMap
        run: |
          cd qdrant-backup-restore
          ./k8s/config_map_updater.sh k8s/configmap-script.yaml qdrant_backup_recovery.sh --git-ref "${{ github.sha }}"

      - name: Commit changes via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          FILE="qdrant-backup-restore/k8s/configmap-script.yaml"
          if git diff --quiet -- "$FILE"; then
            echo "ConfigMap already up to date, nothing to commit"
            exit 0
          fi
          # committer/author intentionally omitted: GitHub signs a bot's API
          # commit (Verified badge) only when the request carries no custom
          # author/committer info. Content goes via @file — the payload
          # exceeds the 128 KiB per-argument cap.
          base64 -w0 < "$FILE" | tr -d '\n' > "$RUNNER_TEMP/content.b64"
          gh api --method PUT "/repos/$REPO/contents/$FILE" \
            -f message="Update ConfigMap with latest script changes" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse "HEAD:$FILE")" \
            -F content=@"$RUNNER_TEMP/content.b64"
